name: catalina-agent

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: Environment
        run: |
          sw_vers
          xcodebuild -version
          rustc -vV
          cmake --version | head -1 || brew install cmake

      - name: Build agent (process-tap path)
        run: cargo build -p oink-agent --release

      - name: Verify deployment target and load commands
        run: |
          BIN=target/release/oink-agent
          file "$BIN"
          otool -l "$BIN" | grep -A4 LC_BUILD_VERSION | head -12
          echo "--- linked frameworks ---"
          otool -L "$BIN"
          codesign --force --sign - "$BIN"
          mkdir -p dist
          cp "$BIN" dist/oink-agent

      - name: Build agent (audio-disabled fallback)
        if: github.event_name == 'workflow_dispatch'
        env:
          OINK_AUDIO_DISABLED: "1"
        run: |
          cargo build -p oink-agent --release
          codesign --force --sign - target/release/oink-agent
          cp target/release/oink-agent dist/oink-agent-no-audio

      - uses: actions/upload-artifact@v4
        with:
          name: oink-agent-catalina-x86_64
          path: dist/
          if-no-files-found: error
